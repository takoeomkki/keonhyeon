<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
        <meta name="description" content="성현 핸드폰 페이지">
        <title>성여이 핸드폰 훔쳐보기</title>
        <style>
            :root {
                --ink: #17191c;
                --muted: #777b82;
                --green: #03c75a
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                font-family: "Noto Sans KR",Roboto,Arial,sans-serif;
                background: #f3f1ee;
                color: #2a2622;
                line-height: 1.95
            }

            body.noscroll {
                overflow: hidden
            }

            button,input {
                font: inherit
            }

            button {
                cursor: pointer;
                border: 0;
                background: none;
                color: inherit;
                padding: 0
            }

            .story {
                max-width: 620px;
                margin: 0 auto;
                padding: 56px 22px 80px
            }

            .story h1 {
                font-size: 22px;
                margin: 0 0 28px
            }

            .story p {
                margin: 0 0 20px
            }

            .story a {
                color: #1d4ed8;
                font-weight: 700;
                text-decoration: underline;
                text-underline-offset: 3px
            }

            #overlay {
                position: fixed;
                inset: 0;
                z-index: 999;
                display: none;
                flex-direction: column;
                align-items: center;
                background: #202329;
                padding: calc(env(safe-area-inset-top,0px) + 4px) 0 calc(env(safe-area-inset-bottom,0px) + 8px)
            }

            #overlay.open {
                display: flex
            }

            .ov-top {
                width: min(100%,420px);
                display: flex;
                justify-content: flex-end;
                padding: 0 6px
            }

            #close {
                color: #fff;
                font-size: 22px;
                width: 44px;
                height: 44px
            }

            .phone {
                position: relative;
                flex: 1;
                min-height: 0;
                width: min(100%,420px);
                max-height: 860px;
                background: #f4f5f8;
                overflow: hidden;
                border-radius: 26px;
                font-family: Roboto,"Noto Sans KR",Arial,sans-serif;
                color: var(--ink);
                line-height: 1.4;
                box-shadow: 0 0 40px #0006
            }

            .status {
                position: absolute;
                z-index: 50;
                top: 0;
                left: 0;
                width: 100%;
                height: 30px;
                padding: 7px 18px 0;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                font-size: 13px;
                font-weight: 600;
                color: #16181c;
                pointer-events: none
            }

            .status .r {
                display: flex;
                gap: 5px;
                align-items: center;
                font-size: 11px
            }

            .status .net {
                font-size: 9px;
                font-weight: 700;
                margin-right: -2px
            }

            .lt .status {
                color: #fff
            }

           .hole {
                position: absolute;
                z-index: 70;

                top: 7px;
                left: 50%;
                transform: translateX(-50%);

                width: 92px;
                height: 27px;

                border-radius: 20px;

                background: #000;

                box-shadow:
                    inset 0 0 4px rgba(255,255,255,.05),
                    0 1px 4px rgba(0,0,0,.35);
            }

            .screen {
                position: absolute;
                inset: 0;
                overflow: hidden;
                background: #f5f6f8
            }

            .home {
                background:
                    linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.12)),
                    url('kean.jpeg') center/cover no-repeat;
                color: #fff;
                padding: 60px 16px 0;
            }

            .widget {
                padding: 8px 4px
            }

            .clock {
                font-size: 58px;
                font-weight: 300;
                letter-spacing: -1px;
                line-height: 1.05
            }

            .clock-sub {
                font-size: 14px;
                opacity: .9;
                margin-top: 4px
            }

            .appgrid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                column-gap: 8px;
                row-gap: 22px;
                margin-top: 30px;
                padding: 0 4px;
            }

            .app {
                display: flex;
                align-items: center;
                flex-direction: column;
                gap: 7px;
                min-width: 0;
                font-size: 12px;
                color: #fff;
                text-align: center;
            }

            .app:active {
                transform: none !important;
            }

            .home .app {
                text-shadow: 0 1px 3px rgba(0,0,0,.65);
            }

            .app-icon {
                width: 60px;
                height: 60px;
                border-radius: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 25px;
                color: #fff;
                font-weight: 700;
                overflow: hidden;
                box-shadow: 0 2px 7px rgba(0,0,0,.18);
            }

            .app-icon img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .dock {
                display: none;
            }

            .iphone-dock {
                position: absolute;
                left: 22px;
                right: 22px;
                bottom: 28px;
                height: 82px;

                border-radius: 28px;

                background: rgba(245, 245, 245, 0.48);
                border: 1px solid rgba(255, 255, 255, 0.55);

                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);

                display: grid;
                grid-template-columns: repeat(4, 1fr);

                align-items: center;
                justify-items: center;

                padding: 7px 12px;

                box-shadow:
                    0 4px 18px rgba(0,0,0,.12),
                    inset 0 1px 0 rgba(255,255,255,.35);
            }

            .iphone-dock .app {
                gap: 0;
            }

            .iphone-dock .app-icon {
                width: 58px;
                height: 58px;
                border-radius: 17px;
                box-shadow: 0 2px 5px rgba(0,0,0,.18);
            }

            #screens {
                position: absolute;
                inset: 0 0 46px 0
            }

            .phone.fs #screens,.phone.ov #screens {
                bottom: 0
            }

            .nav {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 34px;

                display: flex;
                align-items: center;
                justify-content: center;

                background: transparent;
                z-index: 100;
            }

            .iphone-nav {
                pointer-events: auto;
            }

            .home-indicator {
                width: 108px;
                height: 5px;

                padding: 0;
                border: 0;
                border-radius: 999px;

                background: #fff;

                cursor: pointer;

                box-shadow: 0 1px 4px rgba(0,0,0,.4);
            }

            .home-indicator:active {
                transform: scaleX(.92);
            }

            .phone.fs .nav {
                display: none
            }

            .phone.ov .nav {
                background: transparent;
                color: #fff
            }

            .topbar {
                position: absolute;
                z-index: 10;
                top: 29px;
                left: 0;
                right: 0;
                height: 52px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 13px;
                background: inherit
            }

            .topbar strong {
                font-size: 19px;
                flex: 1
            }

            .back {
                font-size: 25px;
                width: 27px;
                text-align: left
            }

            .content {
                position: absolute;
                top: 81px;
                bottom: 0;
                left: 0;
                right: 0;
                overflow: auto;
                padding: 14px 17px 24px
            }

            .muted {
                color: #7a7d84
            }

            .divider {
                height: 1px;
                background: #eceef1;
                margin: 12px 0
            }

            .disabled {
                opacity: .45
            }

            .lock {
                background: linear-gradient(rgba(10,20,40,.08),rgba(10,20,40,.28)),url('kean.jpeg') center/cover no-repeat,#1b2a52;
                color: #fff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: 86px;
                text-align: center;
                cursor: pointer;
                text-shadow: 0 1px 10px #0003
            }


            .wallpaper:after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(#0000 50%,#0002)
            }

            .lockphoto {
                filter: none
            }

            .passphoto {
                filter: blur(18px);
                transform: scale(1.06)
            }

            .lk {
                display: flex;
                opacity: .95
            }

            .locktime {
                font-size: 92px;
                font-weight: 300;
                letter-spacing: -3px;
                line-height: 1;
                margin-top: 14px
            }

            .lockdate {
                font-size: 16px;
                font-weight: 400;
                margin-top: 12px;
                letter-spacing: -.2px
            }

            .lockhint {
                position: absolute;
                bottom: 60px;
                left: 0;
                right: 0;
                font-size: 12.5px;
                opacity: .85
            }

            .shortcut {
                position: absolute;
                bottom: 40px;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: #00000040;
                -webkit-backdrop-filter: blur(8px);
                backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                text-shadow: none
            }

            .shortcut.l {
                left: 36px
            }

            .shortcut.r {
                right: 36px
            }

            .pin {
                background: linear-gradient(rgba(10,20,40,.42),rgba(10,20,40,.58)),url('keanblur.png') center/cover no-repeat,#16203f;
                color: #fff;
                text-shadow: 0 1px 8px #0003
            }

            .pin-head {
                text-align: center;
                padding-top: 64px;
                display: flex;
                flex-direction: column;
                align-items: center
            }

            .pin-head .locktime {
                font-size: 62px;
                margin-top: 10px;
                letter-spacing: -2px
            }

            .pin-head .lockdate {
                font-size: 14px;
                margin-top: 8px
            }

            .pin-title {
                font-size: 16px;
                font-weight: 500;
                margin-top: 34px
            }

            .dots {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 15px;
                margin: 20px 0 8px;
                height: 14px
            }

            .dot {
                width: 13px;
                height: 13px;
                border: 1.6px solid #ffffffd9;
                border-radius: 50%;
                transition: background .1s
            }

            .dot.on {
                background: #fff;
                border-color: #fff
            }

            .dots.shake {
                animation: shake .38s
            }

            @keyframes shake {
                20% {
                    transform: translateX(-9px)
                }

                40% {
                    transform: translateX(8px)
                }

                60% {
                    transform: translateX(-6px)
                }

                80% {
                    transform: translateX(4px)
                }
            }

            .pin-error {
                min-height: 18px;
                font-size: 13px;
                opacity: .95
            }

            .numpad {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 78px;
                display: grid;
                grid-template-columns: repeat(3,76px);
                justify-content: center;
                gap: 14px 26px
            }

            .num {
                width: 76px;
                height: 76px;
                border-radius: 50%;
                background: #ffffff1f;
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                font-weight: 300;
                color: #fff;
                transition: background .1s;
                text-shadow: none
            }

            .num:active {
                background: #ffffff4d
            }

            .num.ico {
                background: transparent;
                -webkit-backdrop-filter: none;
                backdrop-filter: none
            }

            .num.ico:active {
                background: #ffffff2e
            }

            .num.ok {
                background: #ffffff33
            }

            .pin-emg {
                position: absolute;
                bottom: 32px;
                left: 0;
                right: 0;
                text-align: center
            }

            .pin-emg button {
                font-size: 13px;
                opacity: .85;
                padding: 6px 14px
            }

            .pin.enter .pin-head,.pin.enter .numpad,.pin.enter .pin-emg {
                animation: pinin .28s ease-out
            }

            @keyframes pinin {
                from {
                    opacity: 0;
                    transform: translateY(14px)
                }
            }

            @media(prefers-reduced-motion:reduce) {
                .pin.enter .pin-head,.pin.enter .numpad,.pin.enter .pin-emg,.dots.shake {
                    animation: none
                }
            }

            @media(max-height: 720px) {
                .lock {
                    padding-top:60px
                }

                .locktime {
                    font-size: 78px
                }

                .pin-head {
                    padding-top: 46px
                }

                .pin-head .locktime {
                    font-size: 50px
                }

                .pin-title {
                    margin-top: 22px
                }

                .numpad {
                    grid-template-columns: repeat(3,64px);
                    gap: 10px 22px;
                    bottom: 64px
                }

                .num {
                    width: 64px;
                    height: 64px;
                    font-size: 26px
                }

                .pin-emg {
                    bottom: 22px
                }
            }

            .searchbox {
                display: flex;
                align-items: center;
                border: 2px solid var(--blue);
                border-radius: 28px;
                background: #fff;
                padding: 0 14px;
                height: 47px;
                gap: 10px
            }

            .searchbox input {
                border: 0;
                outline: 0;
                min-width: 0;
                flex: 1;
                font-size: 15px
            }

            .searchbox button {
                color: var(--blue);
                font-size: 20px
            }

            .history-title {
                font-weight: 700;
                margin: 22px 0 9px
            }

            .history-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 3px;
                border-bottom: 1px solid #eff0f2;
                font-size: 14px
            }

            .history-item .q {
                flex: 1;
                text-align: left
            }

            .history-item .x {
                color: #9da0a5
            }

            .calendar-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin: 4px 0 15px
            }

            .calendar-head strong {
                font-size: 23px
            }

            .week,.days {
                display: grid;
                grid-template-columns: repeat(7,1fr);
                text-align: center
            }

            .week span {
                font-size: 11px;
                color: #858991;
                padding: 9px 0
            }

            .days button {
                height: 43px;
                border-radius: 50%;
                font-size: 13px;
                position: relative
            }

            .dts {
                position: absolute;
                bottom: 4px;
                left: 0;
                right: 0;
                display: flex;
                justify-content: center;
                gap: 3px;
                pointer-events: none
            }

            .dts i {
                width: 4.5px;
                height: 4.5px;
                border-radius: 50%;
                background: #5275d8
            }

            .dts i.red {
                background: #e8453c
            }

            .dts i.grn {
                background: #2fb457
            }

            .dts i.yel {
                background: #f4b400
            }

            .days .chosen {
                background: #20232a;
                color: #fff
            }

            .days .mutedday {
                color: #c3c5ca
            }

            .card {
                background: #fff;
                border-radius: 14px;
                padding: 13px;
                margin-top: 10px;
                box-shadow: 0 1px 4px #00000008;
                font-size: 14px
            }

            .card .sub {
                font-size: 12px;
                color: #777;
                margin-top: 5px
            }

            .ig {
                background: #fff
            }

            .ig .topbar {
                top: 40px;
                border-bottom: 1px solid #f0f0f0
            }
            .ig > .content {
                padding-top: 18px !important;
            }

            .iglogo {
                font-family: Georgia,serif;
                font-size: 26px!important;
                font-style: italic;
                letter-spacing: -1px
            }

            .stories {
                display: flex;
                gap: 12px;
                overflow-x: auto;
                padding: 5px 0 14px
            }

            .story-i {
                min-width: 61px;
                text-align: center;
                font-size: 10px
            }

            .ring {
                width: 58px;
                height: 58px;
                border-radius: 50%;
                padding: 3px;
                margin: auto auto 5px;
                background: linear-gradient(40deg,#ffd776,#f15a50,#c13584,#833ab4)
            }

            .ring {
                position: relative
            }

            .ring.mine {
                background: transparent
            }

            .ring .plus {
                position: absolute;
                right: -1px;
                bottom: -1px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #0095f6;
                border: 2px solid #fff;
                color: #fff;
                font-size: 13px;
                line-height: 13px;
                text-align: center;
                font-style: normal;
                font-weight: 700
            }

            .ring div {
                height: 100%;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid #fff;
                background: linear-gradient(135deg,#d8c5b5,#8a7467);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px
            }

            .post {
                border-bottom: 1px solid #eee;
                padding-bottom: 15px;
                margin-bottom: 14px
            }

            .post-head {
                display: flex;
                align-items: center;
                gap: 9px;
                padding: 7px 0 10px;
                font-size: 12px;
                font-weight: 700
            }

            .avatar {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: linear-gradient(135deg,#d4b9a3,#5e656c);
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 15px;
                flex-shrink: 0
            }

            .post-art {
                height: 290px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 66px;
                background: linear-gradient(135deg,#d7dce2,#9faab5)
            }

            .post-art.a2 {
                background: linear-gradient(135deg,#f1d7c9,#c1a18d)
            }

            .post-art.a3 {
                background: linear-gradient(135deg,#d5d8c7,#84927a)
            }

            .post-actions {
                display: flex;
                gap: 15px;
                align-items: center;
                padding: 10px 0 4px
            }

            .post-actions button {
                display: flex;
                color: #17191c
            }

            .post-actions svg {
                display: block;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round
            }

            .post-actions .liked {
                color: #ed4956
            }

            .post-actions .liked svg {
                fill: #ed4956
            }

            .post-actions .saved svg {
                fill: #17191c
            }

            .post-actions .right {
                margin-left: auto
            }

            .lk-n {
                font-size: 12px;
                font-weight: 700;
                margin-top: 2px
            }

            .caption {
                font-size: 12px;
                line-height: 1.6;
                white-space: pre-line;
                margin-top: 2px
            }

            .ct.clamp {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden
            }

            .more {
                color: #8e8e8e;
                font-size: 12px;
                display: block
            }

            .cmall {
                font-size: 12px;
                color: #8e8e8e;
                margin-top: 4px
            }

            .cmt {
                font-size: 12px;
                line-height: 1.5;
                margin-top: 2px;
                overflow-wrap: anywhere
            }

            .pdate {
                font-size: 10px;
                color: #8e8e8e;
                margin-top: 6px
            }

            [data-a="acct"] {
                cursor: pointer
            }

            .iggrid {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 2px;
                margin-top: 18px
            }

            .iggrid div {
                aspect-ratio: 1;
                background: linear-gradient(135deg,#c4c8ce,#e2d6cb);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px
            }

            .iggrid [data-a] {
                cursor: pointer
            }

            .dmrow {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 10px 0;
                width: 100%;
                text-align: left
            }

            .dmrow .avatar {
                width: 49px;
                height: 49px
            }

            .dmrow .t {
                flex: 1;
                min-width: 0
            }

            .dmrow strong {
                font-size: 13px
            }

            .dmrow p {
                font-size: 12px;
                color: #777;
                margin: 4px 0 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .dmrow p.new {
                color: #17191c;
                font-weight: 700
            }

            .unread {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #3797f0
            }

            .dmc {
                display: flex;
                gap: 7px;
                align-items: flex-end;
                margin: 4px 0
            }

            .dmc.me {
                justify-content: flex-end
            }

            .dmb {
                max-width: 70%;
                padding: 9px 13px;
                border-radius: 20px;
                font-size: 14px;
                line-height: 1.4;
                background: #efefef;
                overflow-wrap: anywhere;
                white-space: pre-wrap
            }

            .dmc.me .dmb {
                background: #7b61ff;
                color: #fff
            }

            .dmsep {
                text-align: center;
                font-size: 11px;
                color: #8e8e8e;
                margin: 14px 0 10px
            }

            .dmnote {
                text-align: center;
                font-size: 12px;
                color: #8e8e8e;
                margin: 22px 0 8px
            }

            .dmread {
                text-align: right;
                font-size: 10px;
                color: #8e8e8e;
                margin-top: 3px
            }

            .dmshare {
                width: 210px;
                border-radius: 18px;
                background: #efefef;
                overflow: hidden
            }

            .dmshare .sh {
                display: flex;
                gap: 7px;
                align-items: center;
                padding: 8px 10px;
                font-size: 12px;
                font-weight: 700
            }

            .dmshare .sa {
                height: 170px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 54px
            }

            .dmshare .sc {
                padding: 8px 10px 10px;
                font-size: 12px;
                line-height: 1.4;
                display: -webkit-box;

                ksend() {
                    const k = S.k[S.chat];
                    if (!k.rp || !k.rp.length)
                        return;
                    const t = k.rp.shift()
                      , tm = nowStr();
                    k.msgs.push(['me', t, tm]);
                    k.p = t;
                    k.t = tm;
                    if (!k.rp.length) {
                        const mine = S;
                        [].concat(k.an).forEach( (x, i) => setTimeout( () => {
                            if (S === mine)
                                botSay(k, x, 1)
                        }
                        , 1200 + i * 1100))
                    }
                },
                kfree() {
                    const k = S.k[S.chat]
                      , i = $('#kin');
                    if (!k.free || !i)
                        return false;
                    const t = i.value.trim();
                    if (!t)
                        return false;
                    const tm = nowStr()
                      , mine = S;
                    let wait = 900;
                    k.msgs.push(['me', t, tm]);
                    k.p = t;
                    k.t = tm;
                    S.fk = 1;
                    (k.trg || C.triggers).forEach(g => {
                        if (new RegExp(g.re).test(t))
                            g.say.forEach(x => {
                                setTimeout( () => {
                                    if (S === mine)
                                        botSay(k, x)
                                }
                                , wait);
                                wait += 1100
                            }
                            )
                    }
                    );
                    const callSituation = C.callSituations.find(
                        s => new RegExp(s.re).test(t)
                    );

                    if (!k.trg && callSituation)
                        setTimeout(() => {
                            if (S === mine && S.screen !== 'lock' && S.screen !== 'pin' && !S.call) {
                                const n = callSituation.incoming;

                                S.callFrom = S.screen;
                                S.call = {
                                    dir: 'in',
                                    name: n.who,
                                    who: n.who,
                                    on: 0,
                                    lines: n.lines,
                                    shown: 0
                                };

                                S.screen = 'call';
                                draw();
                            }
                        }, wait + 300);
                },
                callrow(d) {
                    return dialOut(d.n, 'phone')
                },
                dialcall() {
                    const s = (C.dialScripts || {})[S.dial];
                    S.dial = '';
                    return dialOut(s.name, 'phone', s.lines)
                },
                ctog(d, el) {
                    const c = S.call;
                    if (!c || c.end)
                        return false;
                    c[d.k] = !c[d.k];
                    el.classList.toggle('on', !!c[d.k]);
                    el.setAttribute('aria-pressed', c[d.k] ? 'true' : 'false');
                    return false
                },
                callacc() {
                    const c = S.call;
                    c.on = 1;
                    c.st = Date.now();
                    callTimer();
                    callStart()
                },
                callend() {
                    const c = S.call;
                    if (!c || c.end)
                        return false;
                    clearInterval(S.ci);
                    clearTimeout(S.cl);
                    clearTimeout(S.co);
                    c.end = 1;
                    const mine = S;
                    S.ce = setTimeout( () => {
                        if (S !== mine || S.call !== c)
                            return;
                        S.screen = S.callFrom || 'home';
                        if (S.screen === 'kchat')
                            S.k[S.chat].u = 0;
                        S.call = null;
                        S.fk = 0;
                        draw();
                        flushQ()
                    }
                    , 2000)
                },
                fol() {
                    if (S.fol)
                        S.sheet = 1;
                    else {
                        S.fol = true;
                        clearTimeout(S.ut)
                    }
                },
                sheetx() {
                    S.sheet = 0
                },
                unfol() {
                    S.sheet = 0;
                    S.fol = false;

                    if (!S.unfDone) {
                        const mine = S;
                        clearTimeout(S.ut);

                        S.ut = setTimeout(() => {
                            if (S !== mine || S.fol) return;

                            S.unfDone = 1;

                            const i = S.k.findIndex(k => k.n === C.unfollow.from);
                            if (i < 0) return;

                            const k = S.k[i];

                            // 상대방: ?
                            let tm = nowStr();
                            k.msgs.push(['them', C.unfollow.texts[0], tm]);
                            k.p = C.unfollow.texts[0];
                            k.t = tm;

                            if (S.screen === 'kchat' && S.chat === i) {
                                k.u = 0;
                                draw();
                            } else {
                                k.u = (k.u || 0) + 1;
                                banner(i, C.unfollow.texts[0]);

                                if (S.screen === 'kakao')
                                    draw();
                            }

                            // 2초 후 상대방: ㅡㅡ
                            setTimeout(() => {
                                if (S !== mine || S.fol) return;

                                tm = nowStr();
                                k.msgs.push(['them', C.unfollow.texts[1], tm]);
                                k.p = C.unfollow.texts[1];
                                k.t = tm;

                                if (S.screen === 'kchat' && S.chat === i) {
                                    k.u = 0;
                                    draw();
                                } else {
                                    k.u = (k.u || 0) + 1;
                                    banner(i, C.unfollow.texts[1]);

                                    if (S.screen === 'kakao')
                                        draw();
                                }
                                k.rp = [...C.unfollow.reply];
                                k.an = [...C.unfollow.answer];

                                if (S.screen === 'kchat' && S.chat === i) {
                                    k.u = 0;
                                    draw();
                                }
                            }, 2000);

                        }, C.unfollow.delay);
                    }
                },
                ndis() {
                    hideNote();
                    return false
                },
                note() {
                    hideNote();
                    if (S.call && !S.call.end)
                        return false;
                    const i = S.note;
                    S.k[i].u = 0;
                    if (S.screen === 'lock' || S.screen === 'pin') {
                        S.pend = i;
                        S.screen = 'pin';
                        S.penter = 1
                    } else {
                        S.chat = i;
                        S.screen = 'kchat'
                    }
                },
                back() {
                    const x = S.screen;
                    S.sheet = 0;
                    if (x === 'call')
                        return false;
                    if (x === 'calendar' && S.cphoto) {
                        S.cphoto = 0;
                        S.egg = 0;
                        return
                    }
                    if (x === 'chat')
                        S.screen = 'messages';
                    else if (x === 'kchat')
                        S.screen = 'kakao';
                    else if (x === 'kprofile')
                        S.screen = 'kchat';
                    else if (x === 'memoedit')
                        S.screen = 'memo';
                    else if (x === 'gallery' && S.gal != null)
                        S.gal = null;
                    else if (x === 'pin') {
                        S.screen = 'lock';
                        S.pend = null
                    } else if (x === 'instagram' && S.ig !== 'home')
                        S.ig = S.ig === 'dmchat' ? 'dm' : S.ig === 'post' ? S.pback : 'home';
                    else if (x !== 'lock' && x !== 'home')
                        S.screen = 'home'
                }
            };
            phone.addEventListener('click', e => {
                const el = e.target.closest('[data-a]');
                if (!el)
                    return;
                const a = el.dataset.a;
                if (a === 'toast') {
                    toast(el.dataset.t);
                    return
                }
                if (ACT[a]) {
                    if (ACT[a](el.dataset, el) !== false)
                        draw()
                }
            }
            );
            phone.addEventListener('load', e => {
                const t = e.target;
                if (t && t.classList && t.classList.contains('kimg') && S && S.screen === 'kchat') {
                    const c = document.querySelector('#screens .content');
                    if (c)
                        c.scrollTop = c.scrollHeight
                }
            }
            , true);
            phone.addEventListener('input', e => {
                const t = e.target;
                if (!t.dataset)
                    return;
                if (t.dataset.mt != null)
                    S.memos[+t.dataset.mt].title = t.value;
                else if (t.dataset.mi != null)
                    S.memos[S.mi].items[+t.dataset.mi].t = t.value;
            }
            );
            phone.addEventListener('submit', e => {
                e.preventDefault();
                const q = new FormData(e.target).get('q').trim();
                if (q) {
                    S.q = q;
                    draw()
                }
            }
            );
            document.addEventListener('keydown', e => {
                if (!openId)
                    return;
                if (e.target.id === 'kin') {
                    if (e.key === 'Enter' && !e.isComposing) {
                        e.preventDefault();
                        if (ACT.kfree() !== false)
                            draw()
                    }
                    return
                }
                if (S.screen === 'memoedit' && e.target.classList && e.target.classList.contains('mit')) {
                    const m = S.memos[S.mi]
                      , j = +e.target.dataset.mi;
                    if (e.key === 'Enter' && !e.isComposing) {
                        e.preventDefault();
                        m.items.splice(j + 1, 0, {
                            t: '',
                            c: 0
                        });
                        S.focus = j + 1;
                        draw()
                    } else if (e.key === 'Backspace' && e.target.value === '' && !e.isComposing && m.items.length > 1) {
                        e.preventDefault();
                        m.items.splice(j, 1);
                        S.focus = Math.max(0, j - 1);
                        draw()
                    }
                    return;
                }
                if (S.screen !== 'pin')
                    return;
                if (/^\d$/.test(e.key))
                    ACT.key({
                        n: e.key
                    });
                else if (e.key === 'Backspace')
                    ACT.bksp();
                else if (e.key === 'Enter')
                    ACT.submit();
                else
                    return;
                draw();
            }
            );

            function openPhone(id) {
                if (openId === id)
                    return;
                if (S) {
                    ['nt', 'cl', 'co', 'ce', 'ut', 'hn'].forEach(k => clearTimeout(S[k]));
                    clearInterval(S.ci)
                }
                C = CHARS[id];
                openId = id;
                t0 = Date.now();
                const d = new Date(C.now)
                  , [mm,dd] = md(d).split('/').map(Number)
                  , yy = +C.now.slice(0, 4);
                const memos = C.memos.map(m => {
                    const [h,...r] = m.x.split('\n');
                    return {
                        title: h,
                        d: memoDate(m.w),
                        items: r.filter(l => l.trim()).map(l => ({
                            c: /^\[x\]\s*/i.test(l) ? 1 : 0,
                            t: l.replace(/^\[x\]\s*/i, '').replace(/^-\s*/, '')
                        }))
                    };
                }
                );
                S = {
                    screen: 'lock',
                    pin: '',
                    err: DEF,
                    y: yy,
                    m: mm - 1,
                    sel: [yy, mm - 1, dd],
                    ig: 'home',
                    tab: 'recent',
                    dial: '',
                    q: '',
                    chat: 0,
                    k: JSON.parse(JSON.stringify(C.kakao)),
                    play: true,
                    pend: null,
                    note: null,
                    mi: 0,
                    memos,
                    lk: {},
                    pre: {},
                    sv: {},
                    calls: JSON.parse(JSON.stringify(C.calls)),
                    dmi: 0,
                    tr: C.start || 0,
                    prog: 38,
                    focus: null,
                    egg: 0,
                    cphoto: 0,
                    pv: null,
                    pback: 'home',
                    pu: null,
                    gal: null,
                    call: null,
                    callFrom: null,
                    ci: null,
                    fk: 0,
                    fol: true,
                    sheet: 0,
                    ut: null,
                    unfDone: 0,
                    pq: []
                };
                (C.autoLike || []).forEach(u => {
                    const on = k => {
                        S.lk[k] = true;
                        S.pre[k] = true
                    }
                    ;
                    C.posts.forEach( (p, i) => {
                        if (p.u === u)
                            on(i)
                    }
                    );
                    ((C.profiles && C.profiles[u] && C.profiles[u].list) || []).forEach( (x, j) => on(x.ref != null ? x.ref : 'u' + u + j));
                }
                );
                phone.innerHTML = STATUS + '<div id="screens"></div>' + NAV + '<div class="note" id="note" data-a="note"></div><div class="toast" id="toast"></div>';
                draw();
                const mine = S;
                
                if (C.notice) {
                    S.nt = C.notice.texts.map((text, i) => {
                        return setTimeout(() => {
                            if (S === mine) {
                                notify({
                                    ...C.notice,
                                    texts: [text]
                                });
                            }
                        }, C.notice.delay * (i + 1));
                    });
                }
                
                $('#overlay').classList.add('open');
                $('#overlay').setAttribute('aria-hidden', 'false');
                document.body.classList.add('noscroll');
            }
            function sync() {
                const m = location.hash.match(/^#phone-(.+)$/)
                  , id = m && decodeURIComponent(m[1]);
                openPhone(CHARS[id] ? id : Object.keys(CHARS)[0]);
            }
            addEventListener('hashchange', sync);
            sync();
        </script>
    </body>
</html>
